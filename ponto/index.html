<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ponto Eletrônico — IBnet</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--card:#1a1d27;--border:#2a2d3e;
  --accent:#3b82f6;--accent2:#6366f1;--brand:#E8390E;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;--yellow:#eab308;--blue:#3b82f6;--gray:#64748b;
  --text:#e2e8f0;--muted:#94a3b8;--radius:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh}

/* mini header */
.mini-header{
  background:#0d1018;border-bottom:1px solid var(--border);
  padding:10px 22px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px
}
.mini-header .mh-left{display:flex;align-items:center;gap:12px}
.mini-header h1{font-size:15px;font-weight:700;letter-spacing:.3px}
.mini-header .mh-sub{font-size:12px;color:var(--muted)}
.mh-clock{font-size:22px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.mh-date{font-size:11px;color:var(--muted);text-transform:capitalize}

main{padding:22px;max-width:1180px;margin:0 auto}

/* view switch (admin) */
.view-switch{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.view-switch button{
  background:var(--card);border:1px solid var(--border);color:var(--muted);
  padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s
}
.view-switch button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.view-switch button:hover:not(.active){border-color:var(--accent);color:var(--text)}

/* ── FUNCIONÁRIO: cartão de ponto ─────────────────────────────────────── */
.clock-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:26px;max-width:520px;margin:0 auto 20px;text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25)
}
.clock-big{font-size:54px;font-weight:800;letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:6px}
.clock-date{font-size:14px;color:var(--muted);text-transform:capitalize;margin-bottom:18px}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:22px}
.status-pill .dot{width:9px;height:9px;border-radius:50%}
.sp-fora{background:rgba(100,116,139,.16);color:#94a3b8}
.sp-fora .dot{background:#94a3b8}
.sp-trab{background:rgba(34,197,94,.15);color:#22c55e}
.sp-trab .dot{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.sp-almoco{background:rgba(249,115,22,.15);color:#f97316}
.sp-almoco .dot{background:#f97316}
.sp-fim{background:rgba(59,130,246,.15);color:#3b82f6}
.sp-fim .dot{background:#3b82f6}

.btn-punch{
  width:100%;border:none;border-radius:14px;padding:20px;font-size:19px;font-weight:800;
  cursor:pointer;font-family:inherit;color:#fff;letter-spacing:.4px;transition:transform .1s,filter .15s;
  display:flex;align-items:center;justify-content:center;gap:10px
}
.btn-punch:active{transform:scale(.98)}
.btn-punch:disabled{opacity:.55;cursor:not-allowed}
.bp-entrada{background:linear-gradient(135deg,#16a34a,#22c55e)}
.bp-saida_almoco{background:linear-gradient(135deg,#ea580c,#f97316)}
.bp-volta_almoco{background:linear-gradient(135deg,#2563eb,#3b82f6)}
.bp-saida{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.btn-punch .ico{font-size:24px}
.btn-secondary{
  width:100%;margin-top:10px;background:transparent;border:1px solid var(--border);
  color:var(--muted);border-radius:12px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit
}
.btn-secondary:hover{border-color:var(--red);color:var(--red)}
.punch-hint{font-size:12px;color:var(--muted);margin-top:14px;min-height:16px}
.done-msg{font-size:15px;color:var(--green);font-weight:700;padding:14px 0}
.folga-note{font-size:13px;color:var(--muted);background:rgba(59,130,246,.08);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:14px}

/* linha de batidas de hoje */
.today-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto 20px}
.today-row.cols-2{grid-template-columns:repeat(2,1fr);max-width:300px}
.tp-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center}
.tp-cell .tp-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px}
.tp-cell .tp-time{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.tp-cell.filled{border-color:var(--accent)}
.tp-cell .tp-time.empty{color:var(--border)}

.summary-bar{
  display:flex;gap:12px;max-width:520px;margin:0 auto 24px;flex-wrap:wrap
}
.summary-bar .sb-box{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.sb-box .sbv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sb-box .sbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:3px}
.saldo-pos{color:var(--green)} .saldo-neg{color:var(--red)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#1e2230;border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:12px;
  font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .25s;z-index:999;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── seções / tabelas ─────────────────────────────────────────────────── */
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:26px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;flex-direction:column;gap:5px}
.filters select,.filters input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:9px;font-size:13px;font-family:inherit;cursor:pointer}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--accent)}
.btn-export{background:var(--accent);border:none;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-export:hover{opacity:.88}
.btn-add{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-add:hover{opacity:.8}
.ed-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:3px 9px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.ed-btn:hover{border-color:var(--accent);color:var(--accent)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{padding:11px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)}
td{padding:10px 14px;border-bottom:1px solid rgba(42,45,62,.4);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(59,130,246,.05)}
.day-sep td{background:rgba(255,255,255,.02);font-weight:700;color:var(--text);font-size:12px;text-transform:none;letter-spacing:0}
.badge{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700}
.b-ok{background:rgba(34,197,94,.15);color:#22c55e}
.b-falta{background:rgba(239,68,68,.15);color:#ef4444}
.b-parcial{background:rgba(234,179,8,.15);color:#eab308}
.gps-link{color:var(--accent);text-decoration:none;font-size:12px}
.gps-link:hover{text-decoration:underline}
.gps-none{color:var(--muted);font-size:12px}
.tot-row td{background:rgba(59,130,246,.07);font-weight:800;border-top:2px solid var(--border)}
.empty-state{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.jornada-note{font-size:12px;color:var(--muted);margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px}

/* ── solicitações de alteração ─────────────────────────────────────────── */
.btn-solic{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;width:100%;justify-content:center}
.btn-solic:hover{border-color:var(--accent);color:var(--accent)}
.solic-wrap{max-width:520px;margin:0 auto}
.vs-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;background:var(--red);color:#fff;border-radius:9px;font-size:11px;font-weight:800;line-height:1}
.sol-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.sol-card.pend{border-left:3px solid var(--yellow)}
.sol-card.aprov{border-left:3px solid var(--green)}
.sol-card.recus{border-left:3px solid var(--red)}
.sol-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sol-who{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.sol-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.sol-motivo{font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 11px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.sol-actions{display:flex;gap:8px;flex-wrap:wrap}
.sol-btn{border:none;padding:8px 15px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.sol-aprovar{background:var(--green);color:#fff}
.sol-recusar{background:transparent;border:1px solid var(--red);color:var(--red)}
.b-pend{background:rgba(234,179,8,.15);color:#eab308}
.b-aprov{background:rgba(34,197,94,.15);color:#22c55e}
.b-recus{background:rgba(239,68,68,.15);color:#ef4444}
/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-ov.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h2{font-size:17px;margin-bottom:4px}
.modal-box .mb-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.mb-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.mb-field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.mb-field input,.mb-field select,.mb-field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:9px;font-size:14px;font-family:inherit}
.mb-field input:focus,.mb-field select:focus,.mb-field textarea:focus{outline:none;border-color:var(--accent)}
.mb-field textarea{resize:vertical;min-height:70px}
.mb-hint{font-size:12px;color:var(--muted)}
.mb-actions{display:flex;gap:10px;margin-top:6px}
.mb-actions button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
.mb-cancel{background:transparent;border:1px solid var(--border);color:var(--text)}
.mb-send{background:var(--accent);color:#fff}
body.light .modal-box .mb-field input,body.light .modal-box .mb-field select,body.light .modal-box .mb-field textarea{background:#f8fafc}

/* ── LIGHT THEME ───────────────────────────────────────────────────────── */
body.light{
  --bg:#f1f5fb;--card:#ffffff;--border:#e2e8f0;
  --accent:#2563eb;--text:#1e293b;--muted:#64748b;
}
body.light .mini-header{background:#ffffff;box-shadow:0 1px 6px rgba(0,0,0,.06)}
body.light .clock-card{box-shadow:0 4px 20px rgba(0,0,0,.08)}
body.light th{background:#f8fafc}
body.light .filters select,body.light .filters input{background:#f8fafc}

@media(max-width:560px){
  main{padding:16px 14px}
  .clock-big{font-size:44px}
  .today-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="mini-header">
  <div class="mh-left">
    <div>
      <h1>⏱️ Ponto Eletrônico</h1>
      <div class="mh-sub" id="mh-user">—</div>
    </div>
  </div>
  <div style="text-align:right">
    <div class="mh-clock" id="mh-clock">--:--</div>
    <div class="mh-date" id="mh-date">—</div>
  </div>
</div>

<main id="app">
  <div class="empty-state">Carregando…</div>
</main>

<!-- Modal: solicitar alteração de ponto -->
<div class="modal-ov" id="solic-modal">
  <div class="modal-box">
    <h2>✏️ Solicitar alteração</h2>
    <div class="mb-sub">Sua solicitação fica pendente até a aprovação do gestor.</div>
    <div class="mb-field">
      <label>Dia</label>
      <input type="date" id="sol-data" onchange="onSolDataChange()">
    </div>
    <div class="mb-field">
      <label>O que você precisa?</label>
      <select id="sol-acao" onchange="onSolAcaoChange()">
        <option value="corrigir">Corrigir / adicionar um horário</option>
        <option value="remover">Remover uma batida errada</option>
      </select>
    </div>
    <div class="mb-field">
      <label>Batida</label>
      <select id="sol-tipo" onchange="onSolTipoChange()"></select>
      <div class="mb-hint" id="sol-atual">—</div>
    </div>
    <div class="mb-field" id="sol-hora-field">
      <label>Horário correto</label>
      <input type="time" id="sol-hora">
    </div>
    <div class="mb-field">
      <label>Motivo (obrigatório)</label>
      <textarea id="sol-motivo" placeholder="Ex.: Esqueci de registrar a saída, encerrei às 18:00."></textarea>
    </div>
    <div class="mb-actions">
      <button class="mb-cancel" onclick="fecharSolic()">Cancelar</button>
      <button class="mb-send" onclick="enviarSolic()">Enviar solicitação</button>
    </div>
  </div>
</div>

<!-- Modal: edição administrativa de ponto (somente gestor/Igor) -->
<div class="modal-ov" id="edit-modal">
  <div class="modal-box">
    <h2>🛠️ Editar ponto</h2>
    <div class="mb-sub">Ajuste manual do gestor — vale imediatamente, sem aprovação.</div>
    <div class="mb-field">
      <label>Funcionário</label>
      <select id="ed-func" onchange="onEdFuncChange()"></select>
    </div>
    <div class="mb-field">
      <label>Dia</label>
      <input type="date" id="ed-date" onchange="renderEdCampos()">
      <div class="mb-hint" id="ed-date-label">—</div>
    </div>
    <div id="ed-campos"></div>
    <div class="mb-hint">Deixe um horário em branco para <b>remover</b> aquela batida.</div>
    <div class="mb-actions">
      <button class="mb-cancel" onclick="fecharEdicao()">Cancelar</button>
      <button class="mb-send" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  PONTO ELETRÔNICO — IBnet
//  4 batidas (CLT): Entrada · Saída p/ almoço · Volta do almoço · Saída
//  Dados: Firebase Realtime Database → ponto/batidas
// ══════════════════════════════════════════════════════════════════════════

// ── CONFIG DA JORNADA (horário fixo p/ todos — varia por dia da semana) ────
// Seg–Sex: 08:00–12:00 · almoço · 14:00–18:00 (8h) · 4 batidas
// Sábado:  08:00–12:00 (4h) · 2 batidas · sem almoço
// Domingo: folga
const JORNADA = {
  semana: { entrada:'08:00', almocoIni:'12:00', almocoFim:'14:00', saida:'18:00' },
  sabado: { entrada:'08:00', saida:'12:00' },
};
const GPS_ON  = true;   // captura de localização na batida

// ── CERCA VIRTUAL (geofence) ────────────────────────────────────────────────
// Só permite bater o ponto dentro do raio do trabalho.
// Centro = IBnet · Av. R-009, qd 50 lt13 - St. Res. Campos Elíseos, Aparecida de Goiânia-GO.
//   ativo:false  → desliga a checagem (aceita de qualquer lugar).
//   raio         → metros a partir do centro (aumente se houver bloqueio indevido).
//   tolerancia   → margem extra (m) para compensar imprecisão do GPS.
// Se ativo:true e o aparelho não fornecer GPS, a batida é bloqueada (sem GPS não dá p/ validar).
const GEOFENCE = {
  ativo:      true,
  lat:        -16.8059582,
  lng:        -49.3157033,
  raio:       200,
  tolerancia: 80,
};

// ── Firebase ──────────────────────────────────────────────────────────────
const fbCfg = {
  apiKey:            "AIzaSyDs4qfrO4SaedymaRMH5JmJul0x066PKng",
  authDomain:        "ibnet-platform.firebaseapp.com",
  databaseURL:       "https://ibnet-platform-default-rtdb.firebaseio.com",
  projectId:         "ibnet-platform",
  storageBucket:     "ibnet-platform.firebasestorage.app",
  messagingSenderId: "468380845527",
  appId:             "1:468380845527:web:88d88aea4731a2f1e8b792"
};
let _app;
try { _app = firebase.app('ponto'); } catch(e){ _app = firebase.initializeApp(fbCfg,'ponto'); }
const db   = firebase.database(_app);
const bref = db.ref('ponto/batidas');
const sref = db.ref('ponto/solicitacoes');

// ── Sessão (sessionStorage compartilhado com o portal, mesma origem) ───────
function getSession(){ try { return JSON.parse(sessionStorage.getItem('ibnet_session')||'null'); } catch(e){ return null; } }
const session = getSession();
const isAdmin = session && session.role === 'admin';
const meFunc  = session ? session.username : '';
const meNome  = session ? (session.nome || session.username) : '';

// ── Constantes de batidas ──────────────────────────────────────────────────
const TIPOS  = ['entrada','saida_almoco','volta_almoco','saida'];
const LABEL  = { entrada:'Entrada', saida_almoco:'Saída p/ almoço', volta_almoco:'Volta do almoço', saida:'Saída' };
const LSHORT = { entrada:'Entrada', saida_almoco:'S. Almoço', volta_almoco:'V. Almoço', saida:'Saída' };
const ICO    = { entrada:'▶️', saida_almoco:'🍽️', volta_almoco:'↩️', saida:'⏹️' };

// ── Utils de data/hora (horário local — equipe no Brasil) ──────────────────
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hm(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function parseHM(s){ if(!s) return null; const [h,m]=s.split(':').map(Number); return h*60+m; }
function fmtDur(min){ if(min==null||isNaN(min)) return '—'; const s=min<0?'-':''; min=Math.abs(Math.round(min)); return s+Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'); }
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function dataExtenso(d){ return DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()]; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── Jornada por dia da semana ──────────────────────────────────────────────
// dow: 0=domingo, 1=segunda … 5=sexta, 6=sábado
function dowFromData(data){ const [y,m,d]=data.split('-').map(Number); return new Date(y,m-1,d).getDay(); }
function jornadaDoDow(dow){
  if(dow===0){ // domingo — folga; se bater, tudo é extra
    return { folga:true, tipos:['entrada','saida'], esperado:0, sched:null };
  }
  if(dow===6){ // sábado — meio período, sem almoço
    const s=JORNADA.sabado;
    return { folga:false, tipos:['entrada','saida'], esperado:parseHM(s.saida)-parseHM(s.entrada), sched:s };
  }
  const s=JORNADA.semana; // seg–sex — 4 batidas
  return { folga:false, tipos:['entrada','saida_almoco','volta_almoco','saida'],
           esperado:(parseHM(s.almocoIni)-parseHM(s.entrada))+(parseHM(s.saida)-parseHM(s.almocoFim)), sched:s };
}
function jornadaDoData(data){ return jornadaDoDow(dowFromData(data)); }
function esperadoDoData(data){ return jornadaDoData(data).esperado; }
function tiposDoData(data){ return jornadaDoData(data).tipos; }

// ── Estado + assinatura em tempo real ──────────────────────────────────────
let allBatidas = [];   // [{_id, func, nome, tipo, ts, data, hora, lat, lng, accuracy}]
let allSolic   = [];   // [{_id, func, nome, data, acao, tipo, horaAtual, horaSolicitada, motivo, status, ...}]
let adminView  = 'relatorios';  // 'relatorios' | 'solicitacoes' | 'registrar'  (só admin)

bref.on('value', snap => {
  const v = snap.val() || {};
  allBatidas = Object.entries(v).map(([id,r]) => ({ _id:id, ...r }));
  render();
});
sref.on('value', snap => {
  const v = snap.val() || {};
  allSolic = Object.entries(v).map(([id,r]) => ({ _id:id, ...r }));
  render();
});

// Agrupa batidas de um funcionário num dia → objeto com horários por tipo
function baterDoDia(func, data){
  const out = {};
  allBatidas
    .filter(b => b.func===func && b.data===data)
    .forEach(b => { // se houver duplicata, mantém a primeira do tipo
      if(!out[b.tipo]) out[b.tipo] = b;
    });
  return out;
}
// Minutos trabalhados a partir dos horários do dia (usa 'agora' p/ segmentos abertos)
function trabalhadoMin(dia, agoraMin){
  const t = k => dia[k] ? parseHM(dia[k].hora) : null;
  const ent=t('entrada'), sa=t('saida_almoco'), va=t('volta_almoco'), sd=t('saida');
  if(ent==null) return 0;
  let total=0;
  // 1º período: entrada → (saída almoço | saída | agora)
  const fim1 = sa!=null ? sa : (va==null && sd!=null ? sd : (sa==null && va==null && sd==null ? agoraMin : sa));
  if(sa!=null){ total += sa-ent; }
  else if(sd!=null && va==null){ total += sd-ent; return Math.max(0,total); } // saiu sem almoço
  else if(agoraMin!=null){ total += Math.max(0,agoraMin-ent); return total; } // ainda no 1º período
  // 2º período: volta → (saída | agora)
  if(va!=null){
    const fim2 = sd!=null ? sd : (agoraMin!=null ? agoraMin : va);
    total += Math.max(0, fim2-va);
  }
  return Math.max(0,total);
}
function statusDoDia(dia){
  if(dia.saida) return {k:'fim',  label:'Jornada encerrada', cls:'sp-fim'};
  if(dia.volta_almoco) return {k:'trab', label:'Trabalhando', cls:'sp-trab'};
  if(dia.saida_almoco) return {k:'almoco', label:'Em almoço', cls:'sp-almoco'};
  if(dia.entrada) return {k:'trab', label:'Trabalhando', cls:'sp-trab'};
  return {k:'fora', label:'Fora do expediente', cls:'sp-fora'};
}
function proximaAcao(dia, tipos){
  tipos = tipos || ['entrada','saida_almoco','volta_almoco','saida'];
  if(tipos.length===2){ // sábado/domingo — entrada → saída (sem almoço)
    if(!dia.entrada) return {primary:'entrada'};
    if(dia.saida)    return {done:true};
    return {primary:'saida'};
  }
  if(!dia.entrada) return {primary:'entrada'};
  if(dia.saida)    return {done:true};
  if(!dia.saida_almoco) return {primary:'saida_almoco', secondary:'saida'};
  if(!dia.volta_almoco) return {primary:'volta_almoco'};
  return {primary:'saida'};
}

// ══════════════ RENDER (roteia por papel) ══════════════
function render(){
  document.getElementById('mh-user').textContent =
    (isAdmin ? 'Administrador · ' : 'Funcionário · ') + (meNome||'—');
  if(!session){ document.getElementById('app').innerHTML =
    '<div class="empty-state">Sessão não encontrada. Acesse pelo portal do sistema.</div>'; return; }
  if(isAdmin && adminView==='relatorios')   return renderAdmin();
  if(isAdmin && adminView==='solicitacoes') return renderSolicitacoes();
  return renderFuncionario(isAdmin ? null : meFunc);
}

// ── VISÃO FUNCIONÁRIO (bater ponto) ─────────────────────────────────────────
function renderFuncionario(func){
  func = func || meFunc;
  const hoje = ymd(new Date());
  const jDia = jornadaDoData(hoje);
  const dia  = baterDoDia(func, hoje);
  const st   = statusDoDia(dia);
  const prox = proximaAcao(dia, jDia.tipos);
  const agoraMin = parseHM(hm(new Date()));
  const trabMin  = trabalhadoMin(dia, (st.k==='trab')?agoraMin:null);
  const saldo    = dia.saida ? (trabMin - jDia.esperado) : null;

  const adminSwitch = isAdmin ? adminViewSwitch('registrar') : '';

  let acaoHtml = (jDia.folga && !dia.saida)
    ? `<div class="folga-note">🌴 Domingo é folga. Se você trabalhar hoje, a batida conta como hora extra.</div>` : '';
  if(prox.done){
    acaoHtml += `<div class="done-msg">✅ Jornada de hoje encerrada. Bom descanso!</div>`;
  } else {
    const p = prox.primary;
    acaoHtml += `<button class="btn-punch bp-${p}" id="btn-primary" onclick="baterPonto('${p}')">
        <span class="ico">${ICO[p]}</span> Registrar ${LABEL[p]}
      </button>`;
    if(prox.secondary){
      acaoHtml += `<button class="btn-secondary" onclick="baterPonto('${prox.secondary}')">Encerrar dia sem almoço (${LABEL[prox.secondary]})</button>`;
    }
  }

  const cells = jDia.tipos.map(t=>{
    const filled = !!dia[t];
    return `<div class="tp-cell ${filled?'filled':''}">
      <div class="tp-label">${LSHORT[t]}</div>
      <div class="tp-time ${filled?'':'empty'}">${filled?dia[t].hora:'--:--'}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    ${adminSwitch}
    <div class="clock-card">
      <div class="clock-big" id="live-clock">${hm(new Date())}</div>
      <div class="clock-date">${dataExtenso(new Date())}</div>
      <div><span class="status-pill ${st.cls}"><span class="dot"></span>${st.label}</span></div>
      ${acaoHtml}
      <div class="punch-hint" id="punch-hint">${GPS_ON?'📍 Sua localização será registrada na batida.':''}</div>
    </div>

    <div class="today-row ${jDia.tipos.length===2?'cols-2':''}">${cells}</div>

    <div class="summary-bar">
      <div class="sb-box"><div class="sbv" id="today-total">${fmtDur(trabMin)}</div><div class="sbl">Trabalhado hoje</div></div>
      <div class="sb-box"><div class="sbv">${jDia.folga?'Folga':fmtDur(jDia.esperado)}</div><div class="sbl">Jornada prevista</div></div>
      <div class="sb-box"><div class="sbv ${saldo==null?'':(saldo>=0?'saldo-pos':'saldo-neg')}">${saldo==null?'—':(saldo>=0?'+':'')+fmtDur(saldo)}</div><div class="sbl">Saldo do dia</div></div>
    </div>

    <div class="solic-wrap" style="margin-bottom:8px"><button class="btn-solic" onclick="abrirSolic()">✏️ Solicitar alteração de ponto</button></div>

    <div class="section-title">Meu espelho — ${MESES[new Date().getMonth()]}</div>
    ${renderEspelho(func, new Date().getFullYear(), new Date().getMonth())}
    ${renderMinhasSolic(meFunc)}
  `;
}

// Espelho mensal de UM funcionário (usado pelo próprio e como sub-tabela)
function renderEspelho(func, ano, mes){
  const dias = diasComBatida(func, ano, mes);
  if(!dias.length) return `<div class="card"><div class="empty-state">Nenhuma batida neste mês.</div></div>`;
  let totTrab=0, totSaldo=0, rows='';
  dias.forEach(data=>{
    const dia = baterDoDia(func, data);
    const trab = trabalhadoMin(dia, null);
    const completo = dia.entrada && dia.saida;
    const saldo = completo ? (trab - esperadoDoData(data)) : null;
    totTrab += trab; if(saldo!=null) totSaldo += saldo;
    const [y,m,d]=data.split('-');
    const dObj=new Date(+y,+m-1,+d);
    const st = completo ? '<span class="badge b-ok">completo</span>'
                        : (dia.entrada ? '<span class="badge b-parcial">parcial</span>' : '<span class="badge b-falta">—</span>');
    rows += `<tr>
      <td>${d}/${m} <span style="color:var(--muted)">${DIAS[dObj.getDay()].slice(0,3)}</span></td>
      <td>${dia.entrada?dia.entrada.hora:'—'}</td>
      <td>${dia.saida_almoco?dia.saida_almoco.hora:'—'}</td>
      <td>${dia.volta_almoco?dia.volta_almoco.hora:'—'}</td>
      <td>${dia.saida?dia.saida.hora:'—'}</td>
      <td>${fmtDur(trab)}</td>
      <td class="${saldo==null?'':(saldo>=0?'saldo-pos':'saldo-neg')}">${saldo==null?'—':(saldo>=0?'+':'')+fmtDur(saldo)}</td>
      <td>${st}</td>
      ${isAdmin?`<td><button class="ed-btn" onclick="abrirEdicao('${func}','${data}')" title="Editar este dia">✏️</button></td>`:''}
    </tr>`;
  });
  return `<div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Dia</th><th>Entrada</th><th>S. Almoço</th><th>V. Almoço</th><th>Saída</th><th>Trabalhado</th><th>Saldo</th><th>Situação</th>${isAdmin?'<th>Ações</th>':''}</tr></thead>
    <tbody>${rows}
      <tr class="tot-row"><td colspan="5">TOTAL (${dias.length} dias)</td><td>${fmtDur(totTrab)}</td><td class="${totSaldo>=0?'saldo-pos':'saldo-neg'}">${(totSaldo>=0?'+':'')+fmtDur(totSaldo)}</td><td></td>${isAdmin?'<td></td>':''}</tr>
    </tbody></table></div></div>`;
}

function diasComBatida(func, ano, mes){
  const set = new Set();
  allBatidas.forEach(b=>{
    if(b.func!==func || !b.data) return;
    const [y,m]=b.data.split('-').map(Number);
    if(y===ano && m===mes+1) set.add(b.data);
  });
  return [...set].sort();
}

// ── VISÃO ADMIN (relatórios de todos) ───────────────────────────────────────
function funcionariosConhecidos(){
  const map = new Map();
  allBatidas.forEach(b=>{ if(b.func && !map.has(b.func)) map.set(b.func, b.nome||b.func); });
  return [...map.entries()]; // [[func,nome],...]
}
// Roster fixo (espelha o portal) — garante que todos apareçam p/ edição do gestor
// mesmo sem batidas ainda. Ao cadastrar novo funcionário no portal, inclua aqui também.
const ROSTER = [ ['davi','Davi Henrique'], ['rutiele','Rutiele'] ];
function rosterMerged(){
  const map = new Map(ROSTER);
  funcionariosConhecidos().forEach(([f,n])=>{ if(!map.has(f)) map.set(f,n); });
  return [...map.entries()];
}

function renderAdmin(){
  const funcs = rosterMerged();
  const now = new Date();
  const curMonth = ymd(now).slice(0,7);
  const selFunc  = window._fFunc || '';
  const selMonth = window._fMonth || curMonth;

  const opts = ['<option value="">Todos os funcionários</option>']
    .concat(funcs.map(([f,n])=>`<option value="${escapeHtml(f)}" ${f===selFunc?'selected':''}>${escapeHtml(n)}</option>`)).join('');

  const alvo = selFunc ? funcs.filter(([f])=>f===selFunc) : funcs;

  let bodyHtml='';

    alvo.forEach(([f,n])=>{
      bodyHtml += `<div class="section-title">${escapeHtml(n)}</div>` + renderEspelho(f, ano, mes-1);
    });

  document.getElementById('app').innerHTML = `

    <div class="jornada-note"><b>Seg–Sex:</b> ${JORNADA.semana.entrada}–${JORNADA.semana.almocoIni} · almoço · ${JORNADA.semana.almocoFim}–${JORNADA.semana.saida} (${fmtDur(jornadaDoDow(1).esperado)}/dia) &nbsp;·&nbsp; <b>Sáb:</b> ${JORNADA.sabado.entrada}–${JORNADA.sabado.saida} (${fmtDur(jornadaDoDow(6).esperado)}) &nbsp;·&nbsp; <b>Dom:</b> folga. &nbsp; Saldo positivo = hora extra; negativo = a compensar.</div>
    <div class="filters">
      <label>Funcionário
        <select id="f-func" onchange="window._fFunc=this.value;renderAdmin()">${opts}</select>
      </label>
      <label>Mês
        <input type="month" id="f-month" value="${selMonth}" onchange="window._fMonth=this.value;renderAdmin()"/>
      </label>
      <button class="btn-export" onclick="exportarCSV()">⬇️ Exportar CSV</button>
      <button class="btn-add" onclick="abrirEdicaoNovo()">➕ Lançar / editar dia</button>
    </div>
    ${bodyHtml}
  `;
}

function setAdminView(v){ adminView = v; render(); }

// ══════════════ SOLICITAÇÕES DE ALTERAÇÃO ══════════════
function solPendentes(){ return allSolic.filter(s=>s.status==='pendente'); }

// Switch de visões do admin (Relatórios · Solicitações · Bater ponto)
function adminViewSwitch(active){
  const pend = solPendentes().length;
  const badge = pend ? `<span class="vs-badge">${pend}</span>` : '';
  return `<div class="view-switch">
    <button class="${active==='relatorios'?'active':''}" onclick="setAdminView('relatorios')">📊 Relatórios</button>
    <button class="${active==='solicitacoes'?'active':''}" onclick="setAdminView('solicitacoes')">📝 Solicitações${badge}</button>
    <button class="${active==='registrar'?'active':''}" onclick="setAdminView('registrar')">⏱️ Bater ponto</button>
  </div>`;
}

function statusBadge(s){
  if(s==='aprovada') return '<span class="badge b-aprov">aprovada</span>';
  if(s==='recusada') return '<span class="badge b-recus">recusada</span>';
  return '<span class="badge b-pend">pendente</span>';
}
function acaoLabel(sol){
  if(sol.acao==='remover') return `Remover a batida de <b>${LABEL[sol.tipo]||sol.tipo}</b>`;
  const verbo = sol.horaAtual ? 'Corrigir' : 'Adicionar';
  const de = sol.horaAtual ? ` (hoje: ${sol.horaAtual})` : '';
  return `${verbo} <b>${LABEL[sol.tipo]||sol.tipo}</b>${de} → <b>${sol.horaSolicitada}</b>`;
}
function solCardHtml(sol, admin){
  const cls = sol.status==='aprovada'?'aprov':(sol.status==='recusada'?'recus':'pend');
  const dia = (sol.data||'').split('-').reverse().join('/');
  const enviado = ((sol.criadoData||'').split('-').reverse().join('/')) + (sol.criadoHora?(' '+sol.criadoHora):'');
  const actions = (admin && sol.status==='pendente') ? `
    <div class="sol-actions">
      <button class="sol-btn sol-aprovar" onclick="aprovarSolic('${sol._id}')">✅ Aprovar</button>
      <button class="sol-btn sol-recusar" onclick="recusarSolic('${sol._id}')">✕ Recusar</button>
    </div>` : '';
  const resp = (sol.status==='recusada' && sol.respostaGestor) ? `<div class="sol-meta">↳ Gestor: ${escapeHtml(sol.respostaGestor)}</div>` : '';
  const topo = admin ? escapeHtml(sol.nome||sol.func) : `Dia ${dia}`;
  return `<div class="sol-card ${cls}">
    <div class="sol-head"><div class="sol-who">${topo} ${statusBadge(sol.status)}</div></div>
    <div class="sol-meta">${admin?('Dia '+dia+' · '):''}${acaoLabel(sol)}</div>
    <div class="sol-motivo">${escapeHtml(sol.motivo||'')}</div>
    ${admin?`<div class="sol-meta">Enviado em ${enviado}</div>`:''}
    ${resp}
    ${actions}
  </div>`;
}

// Visão admin — fila de aprovação
function renderSolicitacoes(){
  const pend = solPendentes().sort((a,b)=>(a.criadoTs||0)-(b.criadoTs||0));
  const dec  = allSolic.filter(s=>s.status!=='pendente').sort((a,b)=>(b.decididoTs||0)-(a.decididoTs||0));
  let html = adminViewSwitch('solicitacoes');
  html += `<div class="section-title">Pendentes (${pend.length})</div>`;
  html += pend.length
    ? `<div class="solic-wrap">${pend.map(s=>solCardHtml(s,true)).join('')}</div>`
    : `<div class="card"><div class="empty-state">Nenhuma solicitação pendente. 🎉</div></div>`;
  if(dec.length){
    html += `<div class="section-title">Histórico (${dec.length})</div>
      <div class="solic-wrap">${dec.slice(0,30).map(s=>solCardHtml(s,true)).join('')}</div>`;
  }
  document.getElementById('app').innerHTML = html;
}

// Lista "Minhas solicitações" (funcionário)
function renderMinhasSolic(func){
  const mine = allSolic.filter(s=>s.func===func).sort((a,b)=>(b.criadoTs||0)-(a.criadoTs||0));
  if(!mine.length) return '';
  return `<div class="section-title">Minhas solicitações</div>
    <div class="solic-wrap">${mine.slice(0,15).map(s=>solCardHtml(s,false)).join('')}</div>`;
}

// ── Modal de solicitação ────────────────────────────────────────────────────
function abrirSolic(){
  const hoje = ymd(new Date());
  const di = document.getElementById('sol-data');
  di.value = hoje; di.max = hoje;
  document.getElementById('sol-acao').value = 'corrigir';
  document.getElementById('sol-hora').value = '';
  document.getElementById('sol-motivo').value = '';
  popularSolTipos(); onSolAcaoChange(); atualizarSolAtual();
  document.getElementById('solic-modal').classList.add('show');
}
function fecharSolic(){ document.getElementById('solic-modal').classList.remove('show'); }
function popularSolTipos(){
  const data = document.getElementById('sol-data').value || ymd(new Date());
  const sel  = document.getElementById('sol-tipo');
  sel.innerHTML = tiposDoData(data).map(t=>`<option value="${t}">${LABEL[t]}</option>`).join('');
}
function onSolDataChange(){ popularSolTipos(); atualizarSolAtual(); }
function onSolTipoChange(){ atualizarSolAtual(); }
function onSolAcaoChange(){
  const acao = document.getElementById('sol-acao').value;
  document.getElementById('sol-hora-field').style.display = (acao==='remover') ? 'none' : 'flex';
}
function atualizarSolAtual(){
  const data = document.getElementById('sol-data').value;
  const tipo = document.getElementById('sol-tipo').value;
  const hint = document.getElementById('sol-atual');
  if(!data || !tipo){ hint.textContent=''; return; }
  const dia = baterDoDia(meFunc, data);
  hint.textContent = dia[tipo] ? `Registrado hoje: ${dia[tipo].hora}` : 'Nenhuma batida registrada nesse campo.';
}
async function enviarSolic(){
  const data   = document.getElementById('sol-data').value;
  const acao   = document.getElementById('sol-acao').value;
  const tipo   = document.getElementById('sol-tipo').value;
  const hora   = document.getElementById('sol-hora').value;
  const motivo = document.getElementById('sol-motivo').value.trim();
  if(!data){ toast('Escolha o dia.'); return; }
  if(!tipo){ toast('Escolha a batida.'); return; }
  if(acao==='corrigir' && !hora){ toast('Informe o horário correto.'); return; }
  if(motivo.length < 5){ toast('Descreva o motivo da alteração.'); return; }
  const dia = baterDoDia(meFunc, data);
  const now = new Date();
  const rec = {
    func:meFunc, nome:meNome, data, acao, tipo,
    horaAtual: dia[tipo] ? dia[tipo].hora : '',
    horaSolicitada: acao==='corrigir' ? hora : '',
    motivo, status:'pendente',
    criadoTs:now.getTime(), criadoData:ymd(now), criadoHora:hm(now)
  };
  try{
    await sref.push(rec);
    fecharSolic();
    toast('✅ Solicitação enviada. Aguarde a aprovação do gestor.');
  }catch(e){ console.error(e); toast('❌ Falha ao enviar: '+e.message); }
}

// ── Decisão do gestor (aplica a alteração no ponto) ─────────────────────────
async function aplicarAjuste(sol){
  const existente = baterDoDia(sol.func, sol.data)[sol.tipo];
  if(sol.acao==='remover'){
    if(existente) await db.ref('ponto/batidas/'+existente._id).remove();
    return;
  }
  const [y,m,d]   = sol.data.split('-').map(Number);
  const [hh,mm]   = sol.horaSolicitada.split(':').map(Number);
  const ts = new Date(y, m-1, d, hh, mm).getTime();
  if(existente){
    await db.ref('ponto/batidas/'+existente._id).update({ hora:sol.horaSolicitada, ts, origem:'ajuste' });
  } else {
    await bref.push({ func:sol.func, nome:sol.nome, tipo:sol.tipo, data:sol.data, hora:sol.horaSolicitada, ts, origem:'ajuste' });
  }
}
async function aprovarSolic(id){
  const sol = allSolic.find(s=>s._id===id); if(!sol) return;
  if(!confirm('Aprovar esta solicitação e aplicar a alteração no ponto?')) return;
  try{
    await aplicarAjuste(sol);
    await db.ref('ponto/solicitacoes/'+id).update({ status:'aprovada', decididoPor:meFunc, decididoNome:meNome, decididoTs:Date.now() });
    toast('✅ Solicitação aprovada e aplicada.');
  }catch(e){ console.error(e); toast('❌ Falha ao aprovar: '+e.message); }
}
async function recusarSolic(id){
  const sol = allSolic.find(s=>s._id===id); if(!sol) return;
  const resp = prompt('Motivo da recusa (opcional, o funcionário verá):', '');
  if(resp===null) return;
  try{
    await db.ref('ponto/solicitacoes/'+id).update({ status:'recusada', decididoPor:meFunc, decididoNome:meNome, decididoTs:Date.now(), respostaGestor:resp||'' });
    toast('Solicitação recusada.');
  }catch(e){ console.error(e); toast('❌ Falha ao recusar: '+e.message); }
}

// ── EDIÇÃO MANUAL DO GESTOR (Igor ajusta o ponto de qualquer funcionário) ───
function abrirEdicao(func, data){
  if(!isAdmin) return;
  const sel = document.getElementById('ed-func');
  sel.innerHTML = rosterMerged().map(([f,n])=>`<option value="${escapeHtml(f)}" ${f===func?'selected':''}>${escapeHtml(n)}</option>`).join('');
  document.getElementById('ed-date').value = data || ymd(new Date());
  renderEdCampos();
  document.getElementById('edit-modal').classList.add('show');
}
function abrirEdicaoNovo(){
  const f = window._fFunc || (rosterMerged()[0]||['davi'])[0];
  abrirEdicao(f, ymd(new Date()));
}
function onEdFuncChange(){ renderEdCampos(); }
function fecharEdicao(){ document.getElementById('edit-modal').classList.remove('show'); }
function renderEdCampos(){
  const func = document.getElementById('ed-func').value;
  const data = document.getElementById('ed-date').value;
  const box  = document.getElementById('ed-campos');
  if(!func || !data){ box.innerHTML=''; document.getElementById('ed-date-label').textContent='—'; return; }
  const jd  = jornadaDoData(data);
  const dia = baterDoDia(func, data);
  document.getElementById('ed-date-label').textContent =
    DIAS[dowFromData(data)] + (jd.folga?' · folga' : ` · esperado ${fmtDur(jd.esperado)}`);
  box.innerHTML = jd.tipos.map(tp=>`
    <div class="mb-field">
      <label>${LABEL[tp]}</label>
      <input type="time" id="ed-t-${tp}" value="${dia[tp]?dia[tp].hora:''}">
    </div>`).join('');
}
async function salvarEdicao(){
  const func = document.getElementById('ed-func').value;
  const data = document.getElementById('ed-date').value;
  if(!func || !data){ toast('Selecione funcionário e dia.'); return; }
  const nome = (rosterMerged().find(([f])=>f===func)||[func,func])[1];
  const jd   = jornadaDoData(data);
  const dia  = baterDoDia(func, data);
  const [y,m,d] = data.split('-').map(Number);
  const ops=[]; let mudou=0;
  jd.tipos.forEach(tp=>{
    const el = document.getElementById('ed-t-'+tp); if(!el) return;
    const hora = el.value;                        // '' ou 'HH:MM'
    const ex   = dia[tp];
    if(!hora){ if(ex){ ops.push(db.ref('ponto/batidas/'+ex._id).remove()); mudou++; } return; }
    const [hh,mm] = hora.split(':').map(Number);
    const ts = new Date(y, m-1, d, hh, mm).getTime();
    if(ex){
      if(ex.hora!==hora){ ops.push(db.ref('ponto/batidas/'+ex._id).update({hora, ts, origem:'edicao_admin', editadoPor:meFunc, editadoTs:Date.now()})); mudou++; }
    } else {
      ops.push(bref.push({func, nome, tipo:tp, data, hora, ts, origem:'edicao_admin', editadoPor:meFunc, editadoTs:Date.now()})); mudou++;
    }
  });
  if(!mudou){ toast('Nada foi alterado.'); fecharEdicao(); return; }
  try{
    await Promise.all(ops);
    toast('✅ Ponto atualizado.');
  }catch(e){ console.error(e); toast('❌ Falha ao salvar: '+e.message); }
  fecharEdicao();
}

// ── Bater ponto (grava no Firebase, com GPS best-effort) ───────────────────
let saving=false;
function getGPS(){
  return new Promise(res=>{
    if(!GPS_ON || !navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), accuracy:Math.round(p.coords.accuracy)}),
      _=>res(null),
      {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
    );
  });
}
// Distância em metros entre dois pontos (fórmula de haversine)
function distanciaMetros(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
async function baterPonto(tipo){
  if(saving) return;
  const func = meFunc, nome = meNome;
  const hoje = ymd(new Date());
  const dia  = baterDoDia(func, hoje);
  if(dia[tipo]){ toast('Essa batida já foi registrada hoje.'); return; }

  saving=true;
  const btn=document.getElementById('btn-primary'); if(btn){btn.disabled=true;}
  const hint=document.getElementById('punch-hint'); if(hint && GPS_ON){hint.textContent='📍 Obtendo localização…';}

  const pos = await getGPS();

  // ── Cerca virtual: precisa estar dentro do raio do trabalho ──
  let distGeo = null;
  if(GEOFENCE.ativo){
    const liberar=()=>{ if(btn){btn.disabled=false;} if(hint){hint.textContent='';} saving=false; };
    if(!pos){ liberar(); toast('📍 Ative a localização (GPS) do aparelho para bater o ponto.'); return; }
    distGeo = distanciaMetros(pos.lat,pos.lng, GEOFENCE.lat,GEOFENCE.lng);
    const margem = Math.min(pos.accuracy||0, GEOFENCE.tolerancia);
    if(distGeo > GEOFENCE.raio + margem){
      liberar();
      toast(`🚫 Fora do local de trabalho (${Math.round(distGeo)} m). Aproxime-se para bater o ponto.`);
      return;
    }
  }

  const now = new Date();
  const rec = { func, nome, tipo, ts:now.getTime(), data:ymd(now), hora:hm(now) };
  if(pos){ rec.lat=pos.lat; rec.lng=pos.lng; rec.accuracy=pos.accuracy; if(distGeo!=null) rec.distancia=Math.round(distGeo); }

  try{
    await bref.push(rec);
    toast(`✅ ${LABEL[tipo]} registrada às ${rec.hora}${pos?'':' (sem GPS)'}`);
    // re-render acontece pelo listener .on('value')
  }catch(e){
    console.error(e); toast('❌ Falha ao registrar: '+e.message);
  }finally{
    saving=false;
  }
}

// ── Exportar CSV (espelho do mês filtrado) ──────────────────────────────────
function exportarCSV(){
  const selFunc = window._fFunc||''; const selMonth = window._fMonth||ymd(new Date()).slice(0,7);
  const [ano,mes]=selMonth.split('-').map(Number);
  const funcs = funcionariosConhecidos().filter(([f])=> !selFunc || f===selFunc);
  const linhas = [['Funcionário','Data','Entrada','Saída Almoço','Volta Almoço','Saída','Trabalhado','Saldo','Situação']];
  funcs.forEach(([f,n])=>{
    diasComBatida(f,ano,mes-1).forEach(data=>{
      const dia=baterDoDia(f,data); const trab=trabalhadoMin(dia,null);
      const completo=dia.entrada&&dia.saida; const saldo=completo?(trab-esperadoDoData(data)):null;
      linhas.push([n, data,
        dia.entrada?dia.entrada.hora:'', dia.saida_almoco?dia.saida_almoco.hora:'',
        dia.volta_almoco?dia.volta_almoco.hora:'', dia.saida?dia.saida.hora:'',
        fmtDur(trab), saldo==null?'':(saldo>=0?'+':'')+fmtDur(saldo),
        completo?'completo':(dia.entrada?'parcial':'—')]);
    });
  });
  const csv = linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`espelho-ponto-${selMonth}${selFunc?'-'+selFunc:''}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// ── Toast ───────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
}

// ── Relógio ao vivo (header + cartão) ───────────────────────────────────────
function tick(){
  const now=new Date();
  document.getElementById('mh-clock').textContent = hm(now);
  document.getElementById('mh-date').textContent  = dataExtenso(now);
  const lc=document.getElementById('live-clock'); if(lc) lc.textContent=hm(now);
  // atualiza total trabalhado se estiver em jornada aberta
  const tt=document.getElementById('today-total');
  if(tt && !isAdmin){
    const dia=baterDoDia(meFunc, ymd(now)); const st=statusDoDia(dia);
    if(st.k==='trab') tt.textContent=fmtDur(trabalhadoMin(dia, parseHM(hm(now))));
  }
}
setInterval(tick,1000); tick();

window.addEventListener('message', e=>{
  if(e.data && e.data.type==='theme'){
    document.body.classList.toggle('light', e.data.value==='light');
  }
});

// primeira renderização (caso o Firebase demore, mostra a UI base já)
